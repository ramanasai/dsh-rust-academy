name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly online content audit (Mondays 06:00 UTC).
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  # Cancel superseded runs for the same ref and event. event_name keeps the
  # weekly scheduled audit from cancelling a push build on main (and vice versa).
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and validate
    # Push, pull request, and manual runs. The weekly schedule only audits.
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Syntax-check src/app.js
        run: node --check src/app.js

      - name: Syntax-check index.js (Host half)
        run: node --check index.js

      - name: Build client.js (includes compiler gate)
        run: node build.mjs

      - name: Syntax-check generated client.js
        run: node --check client.js

      - name: Validate every track data module
        run: |
          set -euo pipefail
          tracks=$(node --input-type=module -e "import { TRACK_FILES } from './src/data/index.mjs'; console.log(TRACK_FILES.join(' '))")
          if [ -z "$tracks" ]; then
            echo "::error::could not read TRACK_FILES from src/data/index.mjs"
            exit 1
          fi
          read -r -a track_list <<< "$tracks"
          failed=()
          for track in "${track_list[@]}"; do
            echo "::group::validate src/data/$track.mjs"
            if node scripts/validate-data.mjs "src/data/$track.mjs"; then
              echo "ok: $track"
            else
              echo "::error::track '$track' failed validation"
              failed+=("$track")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::${#failed[@]} track(s) failed validation: ${failed[*]}"
            exit 1
          fi
          echo "validated ${#track_list[@]} track data modules"

      - name: Validate reference data module
        run: node scripts/validate-data.mjs src/data/reference.mjs

      - name: Compiler gate (baseline)
        run: node scripts/compiler-gate.mjs --baseline

      - name: Content audit (structure only)
        run: node scripts/audit-content.mjs --no-network

      - name: Verify committed client.js is up to date
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- client.js; then
            echo "::error file=client.js::client.js is stale — run 'node build.mjs' and commit the regenerated artifact."
            exit 1
          fi
          echo "client.js matches a fresh build"

  online-audit:
    name: Weekly online content audit
    # Only the schedule and manual dispatch run the network-dependent audit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit content (online)
        run: node scripts/audit-content.mjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-audit
          path: |
            docs/content-audit.md
            .content-audit.json
          retention-days: 30
          if-no-files-found: warn
          # .content-audit.json is a dotfile; upload-artifact v4 skips hidden
          # files unless this is enabled.
          include-hidden-files: true
